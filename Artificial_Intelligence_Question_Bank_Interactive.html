, "D) The agent's sensors fail after 9 steps"], "answer": "A", "explanation": "In an obstacle-free grid, paths of length 9 exceed 100 million; checking for redundant paths speeds up search by roughly 1,000,000x."}, {"id": 126, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Breadth-First Search", "type": "MCQ", "level": "Recall", "question": "What node expansion rule governs Breadth-First Search (BFS)?", "options": ["A) Expand the deepest unexpanded node in the frontier", "B) Expand the shallowest unexpanded node in the frontier", "C) Expand the node with the lowest heuristic value h(n)", "D) Expand the node with the largest path cost g(n)"], "answer": "B", "explanation": "Breadth-First Search (BFS) always expands the shallowest unexpanded node in the frontier (AIMA Section 3.4.1)."}, {"id": 127, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Breadth-First Search Data Structure", "type": "MCQ", "level": "Recall", "question": "Which data structure is conventionally used to implement the frontier queue in Breadth-First Search (BFS)?", "options": ["A) LIFO stack", "B) FIFO queue", "C) Priority queue ordered by h(n)", "D) Hash table"], "answer": "B", "explanation": "BFS is implemented using a First-In-First-Out (FIFO) queue, placing newly generated deeper successors at the end."}, {"id": 128, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "BFS Early Goal Test", "type": "MCQ", "level": "Understanding", "question": "Why can Breadth-First Search apply an 'early goal test' (checking if a node is a goal as soon as it is generated, rather than when popped)?", "options": ["A) Because BFS never expands nodes with equal costs", "B) Because any child generated at depth d is guaranteed to be among the shallowest paths to that state", "C) Because priority queues require early goal testing", "D) Because early goal testing reduces the branching factor to 1"], "answer": "B", "explanation": "BFS can check for a goal upon node generation (early goal test) because any generated node at depth d is already on a shallowest path."}, {"id": 129, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "BFS Space Complexity", "type": "MCQ", "level": "Recall", "question": "What is the worst-case space complexity of Breadth-First Search for branching factor b and solution depth d?", "options": ["A) O(bd)", "B) O(b^d)", "C) O(bm)", "D) O(d^b)"], "answer": "B", "explanation": "BFS stores all generated nodes in memory, resulting in an exponential space complexity of O(b^d)."}, {"id": 130, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "BFS Memory Bottleneck", "type": "MCQ", "level": "Understanding", "question": "Why is memory requirement (space complexity) typically considered a far more serious practical bottleneck than execution time for Breadth-First Search?", "options": ["A) Memory access is slower than CPU processing", "B) All generated nodes at level d must remain stored in memory, consuming gigabytes or terabytes rapidly", "C) BFS empties the memory buffer after every expansion", "D) FIFO queues can only hold a maximum of 1,000 nodes in modern operating systems"], "answer": "B", "explanation": "Memory is the critical bottleneck for BFS: at depth 10 with b=10, it requires roughly 10 Terabytes of memory."}, {"id": 131, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Uniform-Cost Search", "type": "MCQ", "level": "Recall", "question": "Which algorithm is equivalent to Dijkstra's shortest path algorithm in the AI search literature?", "options": ["A) Depth-First Search", "B) Uniform-Cost Search (UCS)", "C) Greedy Best-First Search", "D) Iterative Deepening Search"], "answer": "B", "explanation": "Uniform-Cost Search (UCS) is identical to Dijkstra's algorithm for shortest paths on non-negative weighted graphs."}, {"id": 132, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Uniform-Cost Search Expansion Rule", "type": "MCQ", "level": "Recall", "question": "In Uniform-Cost Search, which node from the frontier is selected for expansion at each step?", "options": ["A) The node with the deepest level in the tree", "B) The node with the lowest path cost g(n) from the start state", "C) The node with the largest number of children", "D) The node generated most recently"], "answer": "B", "explanation": "UCS expands the frontier node with the minimum path cost g(n) from the initial state (AIMA Section 3.4.2)."}, {"id": 133, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "UCS Late Goal Test", "type": "MCQ", "level": "Understanding", "question": "Why MUST Uniform-Cost Search perform its goal test when a node is POPPED from the frontier (late test), rather than when it is generated (early test)?", "options": ["A) To prevent memory overflow in the priority queue", "B) Because a cheaper path to the goal might be discovered later before the goal is expanded", "C) Because priority queues do not support early insertion", "D) Because the start node has cost g(n) = 0"], "answer": "B", "explanation": "UCS must test goals upon popping (late test) because a cheaper path to the goal may be expanded before the more expensive path is processed."}, {"id": 134, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Depth-First Search", "type": "MCQ", "level": "Recall", "question": "What node expansion rule characterizes Depth-First Search (DFS)?", "options": ["A) Expand the shallowest unexpanded node", "B) Expand the deepest unexpanded node in the frontier", "C) Expand the node with the highest heuristic value", "D) Expand nodes in random order"], "answer": "B", "explanation": "Depth-First Search (DFS) always expands the deepest unexpanded node currently in the frontier (AIMA Section 3.4.3)."}, {"id": 135, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "DFS Data Structure", "type": "MCQ", "level": "Recall", "question": "Which data structure is utilized to maintain the frontier in standard Depth-First Search?", "options": ["A) LIFO stack", "B) FIFO queue", "C) Priority queue ordered by g(n)", "D) Binary min-heap"], "answer": "A", "explanation": "DFS is implemented using a Last-In-First-Out (LIFO) queue, commonly known as a stack."}, {"id": 136, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "DFS Space Complexity", "type": "MCQ", "level": "Recall", "question": "What is the primary practical advantage of tree-like Depth-First Search over Breadth-First Search?", "options": ["A) It is always guaranteed to find the optimal cost solution", "B) It has a modest linear space complexity of O(bm)", "C) It never visits redundant paths or cycles", "D) Its time complexity is always O(d)"], "answer": "B", "explanation": "DFS has a very small memory footprint: tree-like DFS stores only O(bm) nodes in memory (linear space)."}, {"id": 137, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "DFS Incompleteness", "type": "MCQ", "level": "Understanding", "question": "Why is standard tree-like Depth-First Search incomplete in state spaces with infinite depth or cycles?", "options": ["A) Because the stack runs out of memory immediately", "B) Because it can follow an infinite branch or cycle forever without ever exploring other alternatives", "C) Because the goal test cannot be performed at depth greater than 10", "D) Because step costs are strictly positive"], "answer": "B", "explanation": "In infinite state spaces or graphs with cycles, tree-like DFS can wander down an infinite branch forever, making it incomplete."}, {"id": 138, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Backtracking Search", "type": "MCQ", "level": "Recall", "question": "In backtracking search (a memory-efficient variant of DFS), how many successor nodes are generated at a time?", "options": ["A) Exactly one successor", "B) All b successors", "C) b / 2 successors", "D) Zero successors"], "answer": "A", "explanation": "Backtracking search generates only one successor at a time, modifying the state directly and reducing memory to O(m) actions."}, {"id": 139, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Depth-Limited Search", "type": "MCQ", "level": "Recall", "question": "In Depth-Limited Search (DLS), what occurs when a search branch reaches the predefined depth limit l?", "options": ["A) The entire program crashes with failure", "B) Nodes at depth l are treated as if they have no successors", "C) The algorithm switches immediately to BFS", "D) The heuristic function is doubled"], "answer": "B", "explanation": "In Depth-Limited Search (DLS), all nodes at the depth limit l are treated as if they have no successors (cut off)."}, {"id": 140, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "DLS Return Values", "type": "MCQ", "level": "Recall", "question": "According to the pseudocode in Figure 3.12, Depth-Limited Search returns which three possible types of values?", "options": ["A) Success, Error, Timeout", "B) Solution node, Failure, or Cutoff", "C) True, False, Null", "D) Optimal, Suboptimal, Infeasible"], "answer": "B", "explanation": "DLS returns a solution node, failure (exhausted all nodes), or cutoff (potential solution beyond depth limit l)."}, {"id": 141, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Iterative Deepening Search", "type": "MCQ", "level": "Recall", "question": "How does Iterative Deepening Search (IDS) determine the depth limit l during its execution?", "options": ["A) It starts at infinity and decreases by 1 each step", "B) It systematically tries increasing depth limits: first 0, then 1, then 2, and so on", "C) It sets the depth limit equal to the heuristic value h(n)", "D) It generates a random depth limit between 1 and 100"], "answer": "B", "explanation": "Iterative Deepening Search (IDS) systematically increases the depth limit l: 0, 1, 2, ..., until a goal is found (Section 3.4.4)."}, {"id": 142, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Iterative Deepening Search Properties", "type": "MCQ", "level": "Recall", "question": "What is the memory (space) complexity of Iterative Deepening Search when a solution exists at depth d with branching factor b?", "options": ["A) O(b^d)", "B) O(bd)", "C) O(d^b)", "D) O(m!)"], "answer": "B", "explanation": "When a solution is at depth d, IDS requires only O(bd) memory because each iteration is a depth-limited search."}, {"id": 143, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Iterative Deepening Search Repetition", "type": "MCQ", "level": "Understanding", "question": "Why is the repeated generation of upper-level nodes in Iterative Deepening Search not a significant computational waste in trees with branching factor b >= 2?", "options": ["A) Because the upper nodes are permanently stored in cache", "B) Because the vast majority of nodes in an exponential tree reside in the bottom level d", "C) Because the processor runs 10 times faster on repeated nodes", "D) Because upper nodes have a cost of zero"], "answer": "B", "explanation": "Because the number of nodes grows exponentially, the bottom level d contains the vast majority of nodes; regenerating upper levels costs little."}, {"id": 144, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Bidirectional Search", "type": "MCQ", "level": "Recall", "question": "What is the fundamental operational principle of Bidirectional Search?", "options": ["A) It runs Breadth-First Search and Depth-First Search in alternating turns", "B) It simultaneously searches forward from the initial state and backward from the goal state", "C) It searches the left subtree and right subtree simultaneously", "D) It evaluates both admissible and inadmissible heuristics concurrently"], "answer": "B", "explanation": "Bidirectional search simultaneously searches forward from the initial state and backward from the goal, meeting in the middle."}, {"id": 145, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Bidirectional Search Complexity", "type": "MCQ", "level": "Understanding", "question": "What is the primary computational motivation for using Bidirectional Search over unidirectional search?", "options": ["A) Searching two frontiers of depth d/2 takes time O(2 * b^(d/2)), which is exponentially smaller than O(b^d)", "B) It completely eliminates the need for sensor data", "C) It requires zero memory because frontiers never store states", "D) It guarantees that all heuristics become strictly consistent"], "answer": "A", "explanation": "Searching two frontiers to depth d/2 takes O(2 * b^(d/2)), which is orders of magnitude smaller than O(b^d) (e.g. 50,000x faster for b=d=10)."}, {"id": 146, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Heuristic Function Definition", "type": "MCQ", "level": "Recall", "question": "In informed search algorithms, what does the heuristic function h(n) estimate?", "options": ["A) The exact cost of the path from the root node to node n", "B) The estimated cost of the cheapest path from the state at node n to a goal state", "C) The total number of nodes currently stored in the frontier", "D) The time required to execute the next action in seconds"], "answer": "B", "explanation": "A heuristic function h(n) estimates the cost of the cheapest path from the state at node n to a goal state (Section 3.5)."}, {"id": 147, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Heuristic at Goal", "type": "MCQ", "level": "Recall", "question": "If node n represents a valid goal state, what is the value of its heuristic function h(n)?", "options": ["A) h(n) = 0", "B) h(n) = 1", "C) h(n) = infinity", "D) h(n) = g(n)"], "answer": "A", "explanation": "At any goal state, the estimated remaining cost to the goal is zero, so h(goal) = 0."}, {"id": 148, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Straight-Line Distance Heuristic", "type": "MCQ", "level": "Recall", "question": "In the Romania route-finding problem, what heuristic function is commonly used to estimate distance to Bucharest?", "options": ["A) Number of toll booths", "B) Straight-line distance (h_SLD)", "C) Manhattan grid distance", "D) Number of intermediate cities"], "answer": "B", "explanation": "The straight-line Euclidean distance (h_SLD) to Bucharest is the classic heuristic used for the Romania route-finding map."}, {"id": 149, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Greedy Best-First Search", "type": "MCQ", "level": "Recall", "question": "Greedy Best-First Search selects which node from the frontier for expansion at each step?", "options": ["A) The node that has the lowest path cost g(n)", "B) The node that has the lowest heuristic value h(n)", "C) The node with the largest evaluation function f(n)", "D) The node that has been in the queue the longest"], "answer": "B", "explanation": "Greedy Best-First Search selects the node with the lowest heuristic value f(n) = h(n), trying to get as close to the goal as possible."}, {"id": 150, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Greedy Best-First Optimality", "type": "MCQ", "level": "Understanding", "question": "Why is Greedy Best-First Search NOT cost-optimal in route finding from Arad to Bucharest?", "options": ["A) It cannot handle graphs with cycles", "B) It greedily chooses locally promising steps (like Fagaras) that lead to longer overall routes (450 miles vs 418 miles)", "C) Its priority queue reverses the order of cities", "D) It requires straight-line distance to be negative"], "answer": "B", "explanation": "Greedy search is not optimal: it chooses Fagaras because h=176, leading to a 450-mile path, missing the 418-mile path through Rimnicu Vilcea."}, {"id": 151, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Evaluation Function", "type": "MCQ", "level": "Recall", "question": "In A* search, what is the standard evaluation function f(n) used to rank nodes in the frontier?", "options": ["A) f(n) = g(n) - h(n)", "B) f(n) = g(n) + h(n)", "C) f(n) = g(n) * h(n)", "D) f(n) = max(g(n), h(n))"], "answer": "B", "explanation": "A* search evaluates nodes using f(n) = g(n) + h(n), combining known past path cost g(n) with estimated future cost h(n) (Section 3.5.2)."}, {"id": 152, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Function Meaning", "type": "MCQ", "level": "Understanding", "question": "In the A* evaluation function f(n) = g(n) + h(n), what does f(n) represent conceptually?", "options": ["A) The exact total execution time of the algorithm", "B) The estimated cost of the best path that continues from the start node through node n to a goal", "C) The depth of the search tree divided by branching factor b", "D) The penalty for visiting a redundant state"], "answer": "B", "explanation": "In A*, f(n) represents the estimated total cost of the cheapest complete path passing from the start through node n to a goal."}, {"id": 153, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Admissibility Definition", "type": "MCQ", "level": "Recall", "question": "A heuristic function h(n) is formally defined as 'admissible' if:", "options": ["A) h(n) is always greater than the true cost h*(n)", "B) h(n) never overestimates the true cost to reach a goal, i.e., h(n) <= h*(n)", "C) h(n) is calculated in polynomial time", "D) h(n) is an integer multiple of the branching factor"], "answer": "B", "explanation": "An admissible heuristic never overestimates the true cost to reach a goal: h(n) <= h*(n) for all nodes n (Section 3.5.2)."}, {"id": 154, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Admissibility Nature", "type": "MCQ", "level": "Understanding", "question": "Because an admissible heuristic never overestimates the true remaining cost to the goal, it is frequently described as being:", "options": ["A) Pessimistic", "B) Optimistic", "C) Random", "D) Inconsistent"], "answer": "B", "explanation": "Because an admissible heuristic never overestimates, it is optimistic—it thinks the goal is closer than it actually is."}, {"id": 155, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Optimality Theorem", "type": "MCQ", "level": "Recall", "question": "According to the fundamental theorem of heuristic search, tree-like A* search is guaranteed to be cost-optimal if:", "options": ["A) The heuristic function h(n) is admissible", "B) The branching factor b is less than 2", "C) The state space is finite and acyclic", "D) All action costs are equal to zero"], "answer": "A", "explanation": "Theorem: Tree-like A* search is guaranteed to find the cost-optimal solution if the heuristic h(n) is admissible."}, {"id": 156, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Consistency Definition", "type": "MCQ", "level": "Recall", "question": "A heuristic function h(n) is 'consistent' (or monotonic) if for every node n and every successor n' generated by action a:", "options": ["A) h(n) <= c(n, a, n') + h(n')", "B) h(n) >= c(n, a, n') + h(n')", "C) h(n) = c(n, a, n')", "D) h(n) + h(n') <= c(n, a, n')"], "answer": "A", "explanation": "Consistency (monotonicity) requires that h(n) <= c(n, a, n') + h(n') for every node n and successor n' (triangle inequality)."}, {"id": 157, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Triangle Inequality", "type": "MCQ", "level": "Understanding", "question": "The mathematical condition for heuristic consistency is a direct application of which geometric principle?", "options": ["A) Pythagorean theorem", "B) Triangle inequality", "C) Cauchy-Schwarz inequality", "D) Central limit theorem"], "answer": "B", "explanation": "Consistency is a form of the triangle inequality: the direct heuristic to the goal cannot exceed the step cost plus the successor's heuristic."}, {"id": 158, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Consistency vs Admissibility", "type": "MCQ", "level": "Understanding", "question": "What is the relationship between consistent heuristics and admissible heuristics?", "options": ["A) Every consistent heuristic is admissible, but not every admissible heuristic is consistent", "B) Every admissible heuristic is consistent, but not vice versa", "C) Consistency and admissibility are completely mutually exclusive", "D) An admissible heuristic can never satisfy the triangle inequality"], "answer": "A", "explanation": "Every consistent heuristic is admissible, but an admissible heuristic is not necessarily consistent (AIMA Section 3.5.2)."}, {"id": 159, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Surely Expanded Nodes", "type": "MCQ", "level": "Recall", "question": "If C* is the cost of the optimal solution path, which set of nodes is guaranteed to be expanded by A* search with a consistent heuristic?", "options": ["A) All nodes with f(n) > C*", "B) All reachable nodes with f(n) < C*", "C) Only nodes whose depth is less than d/2", "D) Every node in the state space graph"], "answer": "B", "explanation": "A* with a consistent heuristic surely expands all reachable nodes whose evaluation cost satisfies f(n) < C* (Section 3.5.3)."}, {"id": 160, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Optimal Efficiency", "type": "MCQ", "level": "Recall", "question": "A* with a consistent heuristic is described as 'optimally efficient' because:", "options": ["A) It uses less memory than Depth-First Search", "B) No other optimal search algorithm using the same heuristic can expand fewer nodes (up to tie-breaking)", "C) Its run time is strictly linear in the solution depth d", "D) It never computes the value of g(n)"], "answer": "B", "explanation": "A* is optimally efficient: no other optimal search algorithm using the same heuristic can expand fewer nodes without risking suboptimality."}, {"id": 161, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "8-Puzzle Heuristics", "type": "MCQ", "level": "Recall", "question": "In the 8-puzzle problem, the heuristic h1(n) is defined as the:", "options": ["A) Sum of horizontal and vertical distances of tiles from their goal positions", "B) Number of misplaced tiles (excluding the blank)", "C) Total number of legal moves available to the blank", "D) Direct straight-line Euclidean distance"], "answer": "B", "explanation": "In the 8-puzzle, h1(n) counts the number of misplaced tiles that are not in their target goal squares (Section 3.6)."}, {"id": 162, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "8-Puzzle Manhattan Distance", "type": "MCQ", "level": "Recall", "question": "In the 8-puzzle problem, the Manhattan distance heuristic h2(n) calculates:", "options": ["A) The number of tiles currently in their exact goal squares", "B) The sum of horizontal and vertical grid steps each tile must take to reach its goal square", "C) The straight-line diagonal Euclidean distance of all tiles", "D) The product of row and column indices for each tile"], "answer": "B", "explanation": "The Manhattan distance h2(n) sums the horizontal and vertical grid moves each tile must make to reach its goal square."}, {"id": 163, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Dominance Definition", "type": "MCQ", "level": "Recall", "question": "If h1 and h2 are both admissible heuristics, and h2(n) >= h1(n) for all nodes n, we say that:", "options": ["A) h1 dominates h2", "B) h2 dominates h1", "C) h2 is inadmissible", "D) h1 is strictly monotonic"], "answer": "B", "explanation": "If h1 and h2 are admissible and h2(n) >= h1(n) for all nodes, then h2 dominates h1 (AIMA Section 3.6.1)."}, {"id": 164, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Dominance and Node Expansion", "type": "MCQ", "level": "Understanding", "question": "Why is a dominant heuristic h2 preferred over h1 in A* search?", "options": ["A) h2 requires less memory to store", "B) A* using h2 will never expand more nodes than A* using h1 (except for tie-breaking)", "C) h2 guarantees that branching factor b becomes 1", "D) h2 eliminates the need to calculate path costs g(n)"], "answer": "B", "explanation": "Domination translates to efficiency: A* using dominant heuristic h2 will never expand more nodes than A* using h1."}, {"id": 165, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Relaxed Problems", "type": "MCQ", "level": "Recall", "question": "A problem derived by removing one or more constraints on actions from the original problem definition is called a/an:", "options": ["A) Relaxed problem", "B) Bounded problem", "C) Factored problem", "D) Dual problem"], "answer": "A", "explanation": "A relaxed problem is created by removing restrictions on actions from the original problem definition (Section 3.6.2)."}, {"id": 166, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Relaxed Problems Theorem", "type": "MCQ", "level": "Understanding", "question": "Why is the optimal solution cost of a relaxed problem guaranteed to be an admissible heuristic for the original problem?", "options": ["A) Because relaxed problems have no goal states", "B) Because removing action constraints adds edges to the state graph, creating shortcuts that can never increase the optimal cost", "C) Because relaxed problems can only be solved using depth-first search", "D) Because all heuristics generated by relaxation equal zero"], "answer": "B", "explanation": "Relaxing rules adds edges/shortcuts to the state graph; the optimal cost in the relaxed graph is therefore a lower bound (admissible)."}, {"id": 167, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Combining Heuristics", "type": "MCQ", "level": "Recall", "question": "If we have a collection of admissible heuristics h1, h2, ..., hk, how can we combine them into a single dominant admissible heuristic h(n)?", "options": ["A) h(n) = min{h1(n), h2(n), ..., hk(n)}", "B) h(n) = max{h1(n), h2(n), ..., hk(n)}", "C) h(n) = h1(n) * h2(n) * ... * hk(n)", "D) h(n) = (h1(n) + h2(n) + ... + hk(n)) / k"], "answer": "B", "explanation": "Given admissible heuristics h1...hk, taking their maximum h(n) = max{h1(n), ..., hk(n)} yields an admissible heuristic that dominates all of them."}, {"id": 168, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Pattern Databases", "type": "MCQ", "level": "Recall", "question": "In sliding-tile puzzles, storing the exact precomputed solution costs for all possible subproblem configurations in a lookup table is known as a:", "options": ["A) Pattern database", "B) Frontier queue", "C) Reached table", "D) Landmark cache"], "answer": "A", "explanation": "A pattern database stores exact precomputed solution costs for subproblems (e.g. subsets of tiles) in a fast lookup table (Section 3.6.3)."}, {"id": 169, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Weighted A* Search", "type": "MCQ", "level": "Recall", "question": "Weighted A* search uses the evaluation function f(n) = g(n) + W * h(n) with W > 1. What is the primary purpose of this weighting?", "options": ["A) To ensure that the heuristic becomes strictly consistent", "B) To trade off solution optimality for a significant reduction in the number of expanded nodes", "C) To eliminate the need for priority queues", "D) To convert graph search into tree search"], "answer": "B", "explanation": "Weighted A* uses f(n) = g(n) + W*h(n) with W > 1; it sacrifices strict optimality to dramatically speed up search and reduce node expansions."}, {"id": 170, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Memory-Bounded Search (SMA*)", "type": "MCQ", "level": "Recall", "question": "When memory is completely full, which node does the Simplified Memory-Bounded A* (SMA*) algorithm drop from the search tree?", "options": ["A) The root node of the tree", "B) The worst leaf node, which has the highest f-value", "C) The newest child node with the lowest g-value", "D) All nodes residing at depth d"], "answer": "B", "explanation": "Simplified Memory-Bounded A* (SMA*) drops the worst leaf node (highest f-score) when memory is exhausted, backing up its value to its parent."}, {"id": 171, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Search Problem Formulation", "type": "T/F", "level": "Recall", "question": "A search problem is formally defined by five components: initial state, actions, transition model, goal states, and action cost function.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: The five components are Initial state, Actions, Transition model, Goal test, and Action cost function (AIMA Section 3.1.1)."}, {"id": 172, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Open-Loop Execution", "type": "T/F", "level": "Understanding", "question": "In a nondeterministic or partially observable environment, an agent can safely execute a search solution using an open-loop system without checking its percepts.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: In nondeterministic or partially observable worlds, an open-loop agent will fail because unobserved contingencies will disrupt the plan."}, {"id": 173, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Search Nodes vs States", "type": "T/F", "level": "Understanding", "question": "A single physical state of the environment can be represented by multiple distinct nodes in a search tree if there are redundant paths to that state.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: In a search tree, multiple distinct nodes can represent the exact same state if multiple paths reach that state."}, {"id": 174, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Node Data Structure", "type": "T/F", "level": "Recall", "question": "Each node in a search tree stores a pointer to its parent node, which allows the solution path of actions to be reconstructed once a goal is reached.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: The PARENT pointer allows the agent to trace back from the goal node to the root to output the sequence of actions."}, {"id": 175, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Graph Search Reached Table", "type": "T/F", "level": "Recall", "question": "Graph search algorithms use a reached table (or closed list) to remember previously explored states and prevent visiting nodes multiple times.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Graph search uses a reached table (closed list) to remember visited states and eliminate redundant paths."}, {"id": 176, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Tree-like Search and Memory", "type": "T/F", "level": "Understanding", "question": "Tree-like search uses more memory than graph search because it maintains both an open list and a closed list of reached states.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: Tree-like search uses LESS memory because it avoids storing the reached table, though it may re-expand duplicate states."}, {"id": 177, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "BFS Completeness", "type": "T/F", "level": "Recall", "question": "Breadth-First Search is complete on infinite state spaces, provided that the branching factor b is finite.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: BFS systematically explores layer by layer; if b is finite, it will eventually reach any shallow solution at depth d."}, {"id": 178, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "BFS Optimality", "type": "T/F", "level": "Understanding", "question": "Breadth-First Search is always cost-optimal, regardless of whether step action costs are identical or widely different.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: BFS is only cost-optimal when all step costs are identical; when costs vary, Uniform-Cost Search must be used."}, {"id": 179, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "BFS Time and Space", "type": "T/F", "level": "Recall", "question": "Both the time complexity and space complexity of Breadth-First Search are exponential in the solution depth d, expressed as O(b^d).", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: BFS generates and stores all nodes up to depth d, yielding O(b^d) time and space complexity."}, {"id": 180, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Uniform-Cost Search", "type": "T/F", "level": "Recall", "question": "Uniform-Cost Search expands nodes in increasing order of their path cost g(n) from the initial state.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: UCS always pops the node with the lowest cumulative path cost g(n) from the priority queue."}, {"id": 181, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "UCS Goal Test", "type": "T/F", "level": "Understanding", "question": "If Uniform-Cost Search applies an early goal test upon generating a node, it is still guaranteed to return the cost-optimal solution.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: An early goal test on UCS can cause it to return a suboptimal path before a cheaper alternative has finished expanding."}, {"id": 182, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "DFS Optimality", "type": "T/F", "level": "Recall", "question": "Depth-First Search is cost-optimal because it always explores the deepest leaves first.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: DFS is not cost-optimal; it returns the first path it stumbles upon, even if a much cheaper path exists on another branch."}, {"id": 183, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "DFS Memory", "type": "T/F", "level": "Recall", "question": "Tree-like Depth-First Search requires only linear space complexity O(bm), where b is branching factor and m is maximum depth.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Tree-like DFS only needs to store the current active path and sibling nodes, requiring linear space O(bm)."}, {"id": 184, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Backtracking Search Space", "type": "T/F", "level": "Recall", "question": "Backtracking search reduces memory requirements even further than standard DFS to just one state description and a path of O(m) actions.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Backtracking modifies states in place and generates 1 successor at a time, needing only O(m) actions + 1 state in memory."}, {"id": 185, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Depth-Limited Search Completeness", "type": "T/F", "level": "Understanding", "question": "Depth-Limited Search is complete even if the chosen depth limit l is smaller than the depth d of the optimal solution.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: If the depth limit l is less than the solution depth d (l < d), DLS will fail to find the goal, making it incomplete."}, {"id": 186, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Iterative Deepening Search", "type": "T/F", "level": "Recall", "question": "Iterative Deepening Search combines the linear memory benefits of DFS with the completeness and optimality of BFS for unit action costs.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: IDS combines the O(bd) memory efficiency of DFS with the completeness and optimality of BFS for unit action costs."}, {"id": 187, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Bidirectional Search Frontiers", "type": "T/F", "level": "Recall", "question": "Bidirectional search maintains two frontiers and two reached tables, searching simultaneously from start and goal.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Bidirectional search runs two simultaneous searches from start and goal, maintaining two frontiers and reached tables."}, {"id": 188, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Greedy Best-First Search", "type": "T/F", "level": "Recall", "question": "Greedy Best-First Search expands the node with the minimum value of evaluation function f(n) = h(n).", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Greedy Best-First Search uses evaluation function f(n) = h(n), ordering nodes purely by estimated distance to goal."}, {"id": 189, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Greedy Search Optimality", "type": "T/F", "level": "Understanding", "question": "Greedy Best-First Search is guaranteed to be cost-optimal because it always expands the node that appears closest to the goal.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: Greedy Best-First Search is not optimal; it can be misled by local heuristic drops into expensive detours."}, {"id": 190, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Evaluation Function", "type": "T/F", "level": "Recall", "question": "The evaluation function for A* search is f(n) = g(n) + h(n), where g(n) is path cost to n and h(n) is estimated cost from n to goal.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: A* combines past cost g(n) and future estimated cost h(n) in f(n) = g(n) + h(n)."}, {"id": 191, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Admissibility Definition", "type": "T/F", "level": "Recall", "question": "An admissible heuristic is one that never overestimates the true cost to reach a goal state.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Admissibility means h(n) is an optimistic lower bound: h(n) <= h*(n) for all nodes n."}, {"id": 192, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Consistency Definition", "type": "T/F", "level": "Recall", "question": "A heuristic is consistent if for every node n and successor n', the triangle inequality h(n) <= c(n, a, n') + h(n') is satisfied.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Consistency requires that the heuristic satisfies the triangle inequality: h(n) <= c(n, a, n') + h(n')."}, {"id": 193, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Consistency and Admissibility", "type": "T/F", "level": "Understanding", "question": "Every consistent heuristic is admissible, but an admissible heuristic is not necessarily consistent.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Consistency strictly implies admissibility; however, an admissible heuristic might not satisfy the triangle inequality."}, {"id": 194, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "A* Surely Expanded Nodes", "type": "T/F", "level": "Recall", "question": "A* search expands no nodes with an evaluation cost strictly greater than the optimal solution cost C*.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: A* with a consistent heuristic will never expand any node whose evaluation cost f(n) exceeds the optimal solution cost C*."}, {"id": 195, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "8-Puzzle Manhattan Admissibility", "type": "T/F", "level": "Understanding", "question": "The Manhattan distance heuristic for the 8-puzzle is admissible because any single move can at most decrease one tile's distance by 1 step.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: In the 8-puzzle, a tile can only move 1 square per action; hence Manhattan distance can never overestimate true move count."}, {"id": 196, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Heuristic Dominance", "type": "T/F", "level": "Recall", "question": "If heuristic h2 dominates h1, then A* search using h2 will never expand more nodes than A* search using h1 (except for tie-breaking).", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Domination implies that every node expanded by h2 would also be expanded by h1, making h2 more prune-effective."}, {"id": 197, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Composite Heuristics", "type": "T/F", "level": "Recall", "question": "Given two admissible heuristics h1 and h2, the composite function h(n) = max(h1(n), h2(n)) is also admissible and dominates both h1 and h2.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Taking the maximum of admissible heuristics preserves admissibility and produces a dominant combined heuristic."}, {"id": 198, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Relaxed Problems", "type": "T/F", "level": "Understanding", "question": "The cost of an optimal solution to a relaxed problem provides an admissible heuristic for the original unrelaxed problem.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: Relaxing constraints creates a supergraph with shortcuts, so the relaxed solution cost is always <= the true cost (admissible)."}, {"id": 199, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "Weighted A* Optimality", "type": "T/F", "level": "Understanding", "question": "Weighted A* search with weight W > 1 is guaranteed to find the strictly cost-optimal solution in every search problem.", "options": ["A) True", "B) False"], "answer": "B", "explanation": "False: Weighted A* (W > 1) is a satisficing, bounded-suboptimal search; it guarantees solution cost <= W * C*, not strict optimality."}, {"id": 200, "chapter": "Chapter 3: Solving Problems by Searching", "topic": "SMA* Thrashing", "type": "T/F", "level": "Recall", "question": "On complex search problems with tight memory limits, SMA* can suffer from thrashing, where it continually regenerates forgotten nodes.", "options": ["A) True", "B) False"], "answer": "A", "explanation": "True: When memory is full, SMA* repeatedly deletes and regenerates candidate nodes, a phenomenon known as memory thrashing."}];
let userAnswers = {};
let currentFilter = 'all';
let searchQuery = '';

function renderQuestions() {
  const container = document.getElementById('questions-list');
  container.innerHTML = '';

  let filtered = questions.filter(q => {
    // Category filter
    let catMatch = true;
    if (currentFilter === 'ch2') catMatch = q.chapter.includes('Chapter 2');
    else if (currentFilter === 'ch3') catMatch = q.chapter.includes('Chapter 3');
    else if (currentFilter === 'mcq') catMatch = q.type === 'MCQ';
    else if (currentFilter === 'tf') catMatch = q.type === 'T/F';
    else if (currentFilter === 'wrong') {
      catMatch = userAnswers[q.id] && userAnswers[q.id] !== q.answer;
    }

    if (!catMatch) return false;

    // Search filter
    if (searchQuery) {
      const query = searchQuery.toLowerCase();
      const inText = q.question.toLowerCase().includes(query);
      const inTopic = q.topic.toLowerCase().includes(query);
      const inOpts = q.options.some(o => o.toLowerCase().includes(query));
      return inText || inTopic || inOpts;
    }
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">No questions match your current filter.</div>';
    return;
  }

  filtered.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-${q.id}`;

    const userAns = userAnswers[q.id];

    let optionsHtml = '';
    q.options.forEach(opt => {
      const optLetter = opt.trim().charAt(0);
      let btnClass = 'opt-btn';

      if (userAns) {
        btnClass += ' disabled';
        if (optLetter === q.answer) {
          btnClass += (userAns === q.answer) ? ' selected-correct' : ' show-correct';
        } else if (optLetter === userAns) {
          btnClass += ' selected-wrong';
        }
      }

      optionsHtml += `<button class="${btnClass}" onclick="selectAnswer(${q.id}, '${optLetter}')">${opt}</button>`;
    });

    // Explanation block (revealed when answered)
    let explanationHtml = '';
    if (userAns) {
      const isCorrect = userAns === q.answer;
      const statusText = isCorrect ? 'Correct!' : 'Incorrect';
      const statusColor = isCorrect ? '#065f46' : '#991b1b';
      explanationHtml = `
        <div class="explanation-box">
          <div class="explain-header" style="color: ${statusColor}">
            <span>${isCorrect ? '✅' : '❌'}</span>
            <span>${statusText} (Correct Answer: <b>${q.answer}</b>)</span>
          </div>
          <div class="explain-text">
            <b>Why this is correct:</b> ${q.explanation}
          </div>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="q-meta">
        <span class="badge badge-ch">${q.chapter.split(':')[0]}</span>
        <span class="badge badge-topic">${q.topic}</span>
        <span class="badge badge-type">${q.type}</span>
        <span class="badge badge-level">${q.level}</span>
      </div>
      <div class="q-title"><b>Q${q.id}.</b> ${q.question}</div>
      <div class="options-grid">${optionsHtml}</div>
      ${explanationHtml}
    `;

    container.appendChild(card);
  });

  updateStats();
}

function selectAnswer(qId, selectedLetter) {
  if (userAnswers[qId]) return;
  userAnswers[qId] = selectedLetter;
  renderQuestions();
}

function updateStats() {
  const answeredCount = Object.keys(userAnswers).length;
  let correctCount = 0;
  for (let id in userAnswers) {
    const q = questions.find(item => item.id == id);
    if (q && userAnswers[id] === q.answer) {
      correctCount++;
    }
  }

  document.getElementById('stat-answered').innerText = answeredCount;
  document.getElementById('stat-correct').innerText = correctCount;
  const scorePercent = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
  document.getElementById('stat-score').innerText = `${scorePercent}%`;
}

function setFilter(category, btnElement) {
  currentFilter = category;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btnElement.classList.add('active');
  renderQuestions();
}

function handleSearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  renderQuestions();
}

function showAllAnswers() {
  questions.forEach(q => {
    if (!userAnswers[q.id]) {
      userAnswers[q.id] = q.answer;
    }
  });
  renderQuestions();
}

function resetQuiz() {
  if (confirm('Do you want to reset all answers and progress?')) {
    userAnswers = {};
    renderQuestions();
  }
}

renderQuestions();
</script>

</html>
